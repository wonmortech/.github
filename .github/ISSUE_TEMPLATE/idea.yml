name: Idea
description: Suggest an improvement or something new.
labels: ["idea"]
body:
  - type: markdown
    attributes:
      value: |
        We start from a real person and a real problem, so the most useful ideas say who needs this and why.
        Ideas for a dtwin product belong in its repository at [github.com/dtwinuz](https://github.com/dtwinuz).
        Proposals to change the charter go to [github.com/dtwinuz/.github](https://github.com/dtwinuz/.github).
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What is hard, missing or confusing today? Who runs into it?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Your idea
      description: What you would like to see. A rough sketch is fine.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Other ways to solve it that you have considered, if any.
  - type: checkboxes
    id: help
    attributes:
      label: Helping
      options:
        - label: I would like to work on this myself.
